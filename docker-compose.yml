services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.2
    container_name: eoffice-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false     # chỉ dùng khi chạy local để phát triển
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
volumes:
  esdata: